name: Google Drive – prepare motif sync PR

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'inventory = metadata only; prepare-pr = read images and prepare a draft PR'
        required: true
        default: inventory
        type: choice
        options:
          - inventory
          - prepare-pr
  # GitHub cron uses UTC. Automatic additions remain disarmed below.
  schedule:
    - cron: '17 * * * *'

permissions: {}

concurrency:
  group: timberart-drive-motifs-sync
  cancel-in-progress: false

jobs:
  inventory:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'inventory' &&
          github.repository == 'heinzwilhelm84-WIL/timberart-design-vorschau' &&
          github.repository_id == '1425353605' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout trusted inventory code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install the pinned free image library
        run: python3 -m pip install --disable-pip-version-check -r tools/requirements-images.txt
      - name: Authenticate with metadata-only scope
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: banded-meridian-424821-j9
          workload_identity_provider: projects/949832006175/locations/global/workloadIdentityPools/timberart-github-sync/providers/timberart-github-actions
          service_account: timberart-drive-sync@banded-meridian-424821-j9.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.metadata.readonly
          access_token_lifetime: 900s
          create_credentials_file: false
          export_environment_variables: false
      - name: Inventory without downloads or repository writes
        env:
          TIMBERART_DRIVE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: python3 -B tools/drive_sync.py --report "$RUNNER_TEMP/drive-sync-report.md"
      - name: Show sanitized inventory
        run: cat "$RUNNER_TEMP/drive-sync-report.md" >> "$GITHUB_STEP_SUMMARY"

  prepare:
    if: >-
      ${{ ((github.event_name == 'workflow_dispatch' && inputs.mode == 'prepare-pr') || github.event_name == 'schedule') &&
          github.repository == 'heinzwilhelm84-WIL/timberart-design-vorschau' &&
          github.repository_id == '1425353605' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Both this reviewed literal and the repository variable must be enabled later.
    env:
      TIMBERART_AUTO_ADDITIONS_ARMED: 'false'
    outputs:
      published: ${{ steps.auto-additions.outputs.published }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout trusted main code at the dispatched commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned free image library
        run: python3 -m pip install --disable-pip-version-check -r tools/requirements-images.txt

      - name: Read pending PR data without checking out its code
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/drive_sync_guard.py --seed

      - name: Obtain a short-lived WIF token with the required read scope
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: banded-meridian-424821-j9
          workload_identity_provider: projects/949832006175/locations/global/workloadIdentityPools/timberart-github-sync/providers/timberart-github-actions
          service_account: timberart-drive-sync@banded-meridian-424821-j9.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          access_token_lifetime: 3600s
          create_credentials_file: false
          export_environment_variables: false

      - name: Prepare previews and metadata transactionally
        env:
          TIMBERART_DRIVE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: python3 -B tools/drive_sync.py --apply --additions-evidence "$RUNNER_TEMP/drive-additions-evidence.json" --report "$RUNNER_TEMP/drive-sync-report.md"

      - name: Show sanitized change report
        run: cat "$RUNNER_TEMP/drive-sync-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate public outputs before staging
        run: python3 -B tools/drive_sync_guard.py

      - name: Publish verified additions only (DISARMED)
        id: auto-additions
        if: ${{ github.event_name == 'schedule' && env.TIMBERART_AUTO_ADDITIONS_ARMED == 'true' && vars.TIMBERART_AUTO_ADDITIONS_ENABLED == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TIMBERART_AUTO_ADDITIONS_ENABLED: ${{ vars.TIMBERART_AUTO_ADDITIONS_ENABLED }}
        run: python3 -B tools/drive_sync_additions.py --publish --evidence "$RUNNER_TEMP/drive-additions-evidence.json" --report "$RUNNER_TEMP/drive-sync-report.md"

      - name: Create or update the generated-data draft PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ github.token }}
          base: main
          branch: bot/drive-motifs-sync
          delete-branch: false
          draft: always-true
          title: 'Motivkatalog aus Google Drive aktualisieren'
          commit-message: 'Update generated motif previews and category mapping'
          body-path: ${{ runner.temp }}/drive-sync-report.md
          add-paths: |
            catalog.json
            data/categories.json
            data/motifs-manifest.json
            data/drive-sync-state.json
            assets/motifs/

  publish-pages-additions:
    # No output is produced while ARMED is false; manual runs can never publish.
    needs: prepare
    if: >-
      ${{ github.event_name == 'schedule' &&
          vars.TIMBERART_AUTO_ADDITIONS_ENABLED == 'true' &&
          needs.prepare.outputs.published != '' &&
          github.repository == 'heinzwilhelm84-WIL/timberart-design-vorschau' &&
          github.repository_id == '1425353605' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFIED_DATA_COMMIT: ${{ needs.prepare.outputs.published }}
    steps:
      - name: Request Pages build only for the verified additions commit
        run: |
          python3 -B - <<'PYCODE'
          import json, os, re, subprocess, time
          def api(path, method='GET'):
              result = subprocess.run(['gh','api','--method',method,path],capture_output=True)
              if result.returncode:
                  raise SystemExit('Pages request failed; no retry or configuration change.')
              return json.loads(result.stdout)
          repository = 'repos/heinzwilhelm84-WIL/timberart-design-vorschau'
          expected = os.environ['VERIFIED_DATA_COMMIT']
          if not re.fullmatch('[a-f0-9]{40}', expected):
              raise SystemExit('Invalid verified commit.')
          pages = api(repository + '/pages')
          if pages.get('build_type') != 'legacy' or pages.get('source') != {'branch':'main','path':'/'}:
              raise SystemExit('Pages configuration requires manual review; no changes made.')
          if api(repository + '/git/ref/heads/main')['object']['sha'] != expected:
              raise SystemExit('main advanced; Pages build refused.')
          api(repository + '/pages/builds', 'POST')
          for attempt in range(24):
              build = api(repository + '/pages/builds/latest')
              if build.get('commit') == expected and build.get('status') == 'built':
                  print('Verified additions Pages build completed.')
                  break
              if build.get('status') == 'errored':
                  raise SystemExit('Pages build failed; manual inspection required.')
              time.sleep(10)
          else:
              raise SystemExit('Pages build not confirmed; manual inspection required.')
          PYCODE
